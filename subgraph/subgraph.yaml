specVersion: 1.0.0
description: Astra Protocol DAO governance subgraph — indexes proposals, votes, delegations, and vault deposits on Arbitrum Sepolia.
repository: https://github.com/aituaitm/astra-protocol

schema:
  file: ./schema.graphql

dataSources:
  # ── ProtocolGovernor ─────────────────────────────────────────────────────
  - kind: ethereum
    name: ProtocolGovernor
    network: arbitrum-sepolia
    source:
      address: "0xD2F3F79699D0Bbb5c3Ce24328cfAcb87b08e6DC5"
      abi: ProtocolGovernor
      startBlock: 269187800
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Proposal
        - Vote
      abis:
        - name: ProtocolGovernor
          file: ./abis/ProtocolGovernor.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
      file: ./src/mapping.ts

  # ── GovernanceToken ───────────────────────────────────────────────────────
  - kind: ethereum
    name: GovernanceToken
    network: arbitrum-sepolia
    source:
      address: "0x6d4820Cf78b1Ca1A7ec9E1ccfB364e283e56F2ba"
      abi: GovernanceToken
      startBlock: 269187800
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Delegation
        - TokenHolder
      abis:
        - name: GovernanceToken
          file: ./abis/GovernanceToken.json
      eventHandlers:
        - event: DelegateChanged(indexed address,indexed address,indexed address)
          handler: handleDelegateChanged
        - event: DelegateVotesChanged(indexed address,uint256,uint256)
          handler: handleDelegateVotesChanged
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mapping.ts

  # ── YieldVault (UUPS Proxy) ───────────────────────────────────────────────
  - kind: ethereum
    name: YieldVault
    network: arbitrum-sepolia
    source:
      address: "0xEAe2F21073290ec7cbA7c6140352a805dD9678cE"
      abi: YieldVault
      startBlock: 269187800
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - VaultDeposit
        - VaultWithdrawal
      abis:
        - name: YieldVault
          file: ./abis/YieldVault.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
      file: ./src/mapping.ts
