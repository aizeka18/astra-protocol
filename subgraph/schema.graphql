"""
Astra Protocol — The Graph Schema
Entities: Proposal, Vote, Delegation, TokenHolder, VaultDeposit, VaultWithdrawal
"""

# ─── Enums ───────────────────────────────────────────────────────────────────

enum ProposalStatus {
  Pending
  Active
  Canceled
  Defeated
  Succeeded
  Queued
  Expired
  Executed
}

# ─── Entities ────────────────────────────────────────────────────────────────

"""
A governance proposal created through ProtocolGovernor.
"""
type Proposal @entity {
  id: ID!                      # proposalId as string
  proposalId: BigInt!
  proposer: Bytes!
  description: String!
  startBlock: BigInt!          # voteStart from ProposalCreated event
  endBlock: BigInt!            # voteEnd from ProposalCreated event
  status: ProposalStatus!
  forVotes: BigInt!
  againstVotes: BigInt!
  abstainVotes: BigInt!
  createdAt: BigInt!           # block.timestamp at creation
  votes: [Vote!]! @derivedFrom(field: "proposal")
}

"""
A single vote cast on a proposal (VoteCast event).
support: 0 = Against, 1 = For, 2 = Abstain
"""
type Vote @entity {
  id: ID!                      # txHash-logIndex
  proposal: Proposal!
  voter: Bytes!
  support: Int!
  weight: BigInt!
  reason: String!
  blockTimestamp: BigInt!
}

"""
A delegation event — delegator assigns voting power to toDelegate.
"""
type Delegation @entity {
  id: ID!                      # txHash-logIndex
  delegator: Bytes!
  fromDelegate: Bytes!
  toDelegate: Bytes!
  blockTimestamp: BigInt!
}

"""
Aggregate AGT token state per address, updated on every Transfer / DelegateChanged.
"""
type TokenHolder @entity {
  id: ID!                      # holder address (lowercase hex)
  balance: BigInt!
  delegatedTo: Bytes
  votingPower: BigInt!
}

"""
A deposit into the ERC-4626 YieldVault.
"""
type VaultDeposit @entity {
  id: ID!                      # txHash-logIndex
  sender: Bytes!
  owner: Bytes!
  assets: BigInt!              # underlying USDC amount (6 decimals)
  shares: BigInt!              # avTKN shares minted
  blockTimestamp: BigInt!
}

"""
A withdrawal from the ERC-4626 YieldVault.
"""
type VaultWithdrawal @entity {
  id: ID!                      # txHash-logIndex
  sender: Bytes!
  receiver: Bytes!
  owner: Bytes!
  assets: BigInt!
  shares: BigInt!
  blockTimestamp: BigInt!
}
